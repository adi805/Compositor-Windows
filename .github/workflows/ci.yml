name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        # --locked-mode refuses to resolve anything packages.lock.json does not already name, so a
        # dependency that changed under us fails the build instead of quietly entering the graph.
        run: dotnet restore Compositor.Windows.sln --locked-mode
      - name: Build
        run: dotnet build Compositor.Windows.sln --no-restore -c Release
      - name: Test (Core)
        run: dotnet test tests/Compositor.Core.Tests --no-build -c Release
      - name: Test (App)
        run: dotnet test tests/Compositor.App.Tests --no-build -c Release
      - name: Smoke (App entry point)
        run: dotnet run --project src/Compositor.App -c Release --no-build -- --smoke
