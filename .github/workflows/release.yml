name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # The gate. A tag used to publish straight from the publish step, so a tag on a commit that never
  # passed CI produced a release nobody had tested. Every check here runs on the tagged commit, which
  # is what `actions/checkout` gives on a tag push: the SHA the tag points at, not the branch tip.
  gate:
    name: Uji commit yang di-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Record the commit under test
        run: |
          expected=$(git rev-parse "${GITHUB_REF_NAME}^{commit}")
          actual=$(git rev-parse HEAD)
          echo "tag ${GITHUB_REF_NAME} -> ${expected}; checked out ${actual}"
          if [ "$expected" != "$actual" ]; then
            echo "::error::checked out ${actual} but the tag points at ${expected}; the tests would not cover the release"
            exit 1
          fi
      - name: Restore
        run: dotnet restore Compositor.Windows.sln
      - name: Build
        run: dotnet build Compositor.Windows.sln --no-restore -c Release
      - name: Test (Core)
        run: dotnet test tests/Compositor.Core.Tests --no-build -c Release
      - name: Test (App)
        run: dotnet test tests/Compositor.App.Tests --no-build -c Release
      - name: Smoke (rendering + native codecs)
        run: dotnet run --project src/Compositor.App -c Release --no-build -- --smoke

  # Windows coverage, which this workflow never had: the release ships a win-x64 self-contained
  # build, and nothing had ever run it on Windows. The packaged executable is started from the
  # extracted zip exactly as a user would, so a missing native asset or a bad publish profile shows
  # up here rather than in a bug report.
  windows:
    name: Uji Windows asli
    needs: gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build Compositor.Windows.sln -c Release
      - name: Test (Core)
        run: dotnet test tests/Compositor.Core.Tests --no-build -c Release
      - name: Test (App)
        run: dotnet test tests/Compositor.App.Tests --no-build -c Release
      - name: Publish (win-x64, self-contained)
        run: dotnet publish src/Compositor.App -c Release -r win-x64 --self-contained true -o publish
      - name: Smoke the published executable
        shell: pwsh
        run: |
          $exe = Join-Path "publish" "Compositor.App.exe"
          if (-not (Test-Path $exe)) { throw "publish produced no $exe" }
          & $exe --smoke
          if ($LASTEXITCODE -ne 0) { throw "the published build failed its smoke check ($LASTEXITCODE)" }
      - name: Smoke from the extracted zip
        shell: pwsh
        run: |
          # The release asset is a zip the user unpacks, so the thing to test is the unpacked tree:
          # a zip that drops a native library, or a path the executable cannot resolve once it moves,
          # only shows up after extraction.
          $zip = "Compositor-Windows-$($env:GITHUB_REF_NAME)-win-x64.zip"
          Compress-Archive -Path "publish/*" -DestinationPath $zip
          Expand-Archive -Path $zip -DestinationPath extracted
          & (Join-Path "extracted" "Compositor.App.exe") --smoke
          if ($LASTEXITCODE -ne 0) { throw "the extracted build failed its smoke check ($LASTEXITCODE)" }

  publish:
    name: Terbitkan rilis
    needs: [gate, windows]
    runs-on: ubuntu-latest
    steps:
      # Pinned to commit SHAs, not moving tags: a tag is not a fixed dependency.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - name: Publish (win-x64, self-contained)
        env:
          # Baked into the assembly so the shipped binary can authenticate its own updates. A build
          # without it carries no publisher key, and the updater says so rather than pretending it
          # verified anything.
          CompositorUpdatePublicKey: ${{ vars.UPDATE_PUBLIC_KEY }}
        run: |
          if [ -z "$CompositorUpdatePublicKey" ]; then
            echo "::error::The UPDATE_PUBLIC_KEY repository variable is not set, so the published binary"
            echo "::error::would carry no publisher key and could not authenticate its own updates."
            echo "::error::See docs/UPDATE-SIGNING.md."
            exit 1
          fi
          dotnet publish src/Compositor.App -c Release -r win-x64 --self-contained true -o publish \
            -p:CompositorUpdatePublicKey="$CompositorUpdatePublicKey"
      - name: Zip
        run: |
          cd publish
          zip -r ../Compositor-Windows-${GITHUB_REF_NAME}-win-x64.zip .
      - name: Checksums
        run: sha256sum "Compositor-Windows-${GITHUB_REF_NAME}-win-x64.zip" > SHA256SUMS
      - name: Sign the checksum manifest
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          # The signature is what makes the checksum a statement by the publisher rather than by
          # whoever could reach the release page: a compromised release credential can replace the zip
          # and its SHA256SUMS together, and cannot produce this.
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo "::error::UPDATE_SIGNING_KEY is not set. The updater authenticates releases with a"
            echo "::error::publisher key, so an unsigned release would be refused by every pinned build."
            echo "::error::Generate a key and store the private half as the UPDATE_SIGNING_KEY secret:"
            echo "::error::see docs/UPDATE-SIGNING.md."
            exit 1
          fi
          printf '%s' "$UPDATE_SIGNING_KEY" > signing.key
          openssl rsa -in signing.key -pubout -out signing.pub 2>/dev/null
          openssl dgst -sha256 -sign signing.key -out SHA256SUMS.sig SHA256SUMS
          # Round-trip it here rather than discovering a bad key when a user's update is refused.
          openssl dgst -sha256 -verify signing.pub -signature SHA256SUMS.sig SHA256SUMS
          rm -f signing.key signing.pub
          echo "signed SHA256SUMS ($(wc -c < SHA256SUMS.sig) byte signature)"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="docs/releases/${GITHUB_REF_NAME}.md"
          [ -f "$NOTES" ] || NOTES="docs/RELEASE-NOTES.md"
          gh release create "${GITHUB_REF_NAME}" \
            "Compositor-Windows-${GITHUB_REF_NAME}-win-x64.zip" \
            "SHA256SUMS" \
            "SHA256SUMS.sig" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Compositor.Windows ${GITHUB_REF_NAME}" \
            --notes-file "$NOTES" \
            --latest
