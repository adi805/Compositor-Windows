# Kenapa berkas ini ada: sebelumnya nol mekanisme yang memberi tahu kalau paket .NET atau
# action CI kita punya versi yang menambal kerentanan. Alert saja tidak cukup, karena alert
# tidak pernah membuka PR, jadi tidak ada yang benar-benar memperbaiki.
version: 2

updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 5
    reviewers:
      - "adi805"
    groups:
      # Minor dan patch digabung jadi satu PR: operator tunggal tidak perlu menerima
      # belasan PR per minggu. Major tetap terpisah karena bisa memecah API.
      dotnet-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels:
      - "dependencies"
    # Avalonia 12 bukan soal nomor versi, tapi soal runtime: analyzer-nya dikompilasi
    # terhadap Roslyn 4.14, sementara repo ini masih dipin di SDK 8 (Roslyn 4.11),
    # sehingga setiap job mati dengan CS9057 sebelum satu test pun jalan. Bump mayor
    # ini hanya bermakna setelah migrasi net8.0 -> net10.0 (docs/RUNTIME-MIGRATION.md),
    # jadi ditahan di sini alih-alih membuka PR merah baru setiap Senin.
    ignore:
      - dependency-name: "Avalonia*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 5
    reviewers:
      - "adi805"
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels:
      - "dependencies"
